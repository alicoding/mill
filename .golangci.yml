version: "2"

linters:
  default: standard
  enable:
    - unused
    - staticcheck
    # goal 0028, first strengthening pass (security + HTTP-client hygiene
    # matching what the code actually does -- procexec/httpconnector/
    # openapispec are the real attack-surface packages).
    - gosec
    - bodyclose
    - noctx
    - revive
    - unparam
    # Second pass (docs/goals/BACKLOG.md Standing #11b, named as future
    # work in goal 0028): gocritic (style/perf/correctness diagnostics),
    # prealloc (slice-append capacity hints), contextcheck (context.Context
    # propagation, non-inherited-context bugs), sqlclosecheck (unclosed
    # *sql.Rows/*sql.Stmt). Findings triaged to zero on both build-tag
    # variants (default + `server`), same discipline as the first pass --
    # real ones fixed, a rule that genuinely misfires against this repo's
    # own house style gets a scoped settings tweak or a per-line `//nolint`
    # with a reason, never a blanket disable.
    - gocritic
    - prealloc
    - contextcheck
    - sqlclosecheck
  exclusions:
    paths:
      - frontend
      - build
      - third_party$
      - builtin$
      - examples$

  settings:
    revive:
      rules:
        # This repo has never doc-commented every exported symbol --
        # confirmed by the first real run of this rule, which flagged
        # ~40 pre-existing exported consts/types/funcs across files that
        # already had real, deliberate doc comments on the pieces that
        # matter (packages, non-obvious functions) and none on
        # self-explanatory ones (e.g. `StatusLocked Status = "LOCKED"`).
        # Enforcing full Java/godoc-style coverage retroactively is
        # ceremony that fights the established house style, not a real
        # finding -- goal 0028's own explicit "tune revive if its
        # defaults fight house style" guidance (e.g. package-comments).
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  exclusions:
    paths:
      - third_party$
      - builtin$
      - examples$
