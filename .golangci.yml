version: "2"

linters:
  default: standard
  enable:
    - unused
    - staticcheck
    # goal 0028, first strengthening pass (security + HTTP-client hygiene
    # matching what the code actually does -- procexec/httpconnector/
    # openapispec are the real attack-surface packages).
    - gosec
    - bodyclose
    - noctx
    - revive
    - unparam
    # Second pass (docs/goals/BACKLOG.md Standing #11b, named as future
    # work in goal 0028): gocritic (style/perf/correctness diagnostics),
    # prealloc (slice-append capacity hints), contextcheck (context.Context
    # propagation, non-inherited-context bugs), sqlclosecheck (unclosed
    # *sql.Rows/*sql.Stmt). Findings triaged to zero on both build-tag
    # variants (default + `server`), same discipline as the first pass --
    # real ones fixed, a rule that genuinely misfires against this repo's
    # own house style gets a scoped settings tweak or a per-line `//nolint`
    # with a reason, never a blanket disable.
    - gocritic
    - prealloc
    - contextcheck
    - sqlclosecheck
    # Third pass (goal 0109, the SonarQube-class duplication gate):
    # threshold and exclusions tuned from a full measurement run over
    # the tree, so the gate lands green and catches NEW duplication
    # anywhere outside the named, deliberate families. configuresvc's
    # own per-entity seed/CRUD exclusion (the largest cluster) was
    # removed once goal 0165's generic entity store collapsed the
    # duplication it covered, rather than raised or left in place.
    - dupl
  exclusions:
    paths:
      - frontend
      - build
      - third_party$
      - builtin$
      - examples$
    rules:
      # Test twins (a Go test asserting the same shape twice) are the
      # documented-noise class Sonar's own defaults also exempt.
      - path: _test\.go
        linters: [dupl]
      # configuresvc's per-entity seed/CRUD shape now runs through
      # internal/services/entitystore's generic store (goal 0165) --
      # the exclusion this comment used to justify is gone along with
      # the duplication it covered.
      - path: internal/services/atlassvc/atlasservice_builtin\.go
        linters: [dupl]

  settings:
    dupl:
      threshold: 150
    # gocognit is deliberately NOT in `enable:` above -- 25 legacy
    # production functions sit over its threshold (max 65; burn-down
    # list in docs/goals/0109), so a repo-wide gate would either fail
    # every build or need a threshold too high to mean anything.
    # Instead it gates NEW/CHANGED code only (Sonar's own
    # clean-as-you-code posture), via a dedicated
    # `--enable-only gocognit --new-from-merge-base` invocation in
    # lefthook and CI, which reads this threshold.
    gocognit:
      min-complexity: 15
    revive:
      rules:
        # This repo has never doc-commented every exported symbol --
        # confirmed by the first real run of this rule, which flagged
        # ~40 pre-existing exported consts/types/funcs across files that
        # already had real, deliberate doc comments on the pieces that
        # matter (packages, non-obvious functions) and none on
        # self-explanatory ones (e.g. `StatusLocked Status = "LOCKED"`).
        # Enforcing full Java/godoc-style coverage retroactively is
        # ceremony that fights the established house style, not a real
        # finding -- goal 0028's own explicit "tune revive if its
        # defaults fight house style" guidance.
        - name: exported
          disabled: true
        # Not part of golangci-lint's revive default rule set (confirmed
        # empirically: it doesn't fire until listed here explicitly) --
        # goal 0049's anti-rot floor. Every package needs a real,
        # one-time purpose/constraints comment; the rule holds that
        # floor on every subsequent package forever after.
        - name: package-comments

formatters:
  exclusions:
    paths:
      - third_party$
      - builtin$
      - examples$
