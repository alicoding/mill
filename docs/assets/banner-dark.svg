<svg width="880" height="230" viewBox="0 0 880 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mill — guardrailed agentic workflows, on your desktop">
  <!-- Node-chain motif: trigger -> capture -> process -> guardrail gate -> apply.
       Colors are Mill's own kind/accent tokens (frontend/src/app/mill-tokens.css,
       dark values) so the banner and the canvas stay one identity. -->
  <g>
    <line x1="292" y1="46" x2="348" y2="46" stroke="#9198A1" stroke-width="1.5"/>
    <line x1="372" y1="46" x2="428" y2="46" stroke="#9198A1" stroke-width="1.5"/>
    <line x1="452" y1="46" x2="511" y2="46" stroke="#9198A1" stroke-width="1.5"/>
    <line x1="553" y1="46" x2="588" y2="46" stroke="#9198A1" stroke-width="1.5"/>
    <circle cx="280" cy="46" r="9" fill="#8957E5"/>
    <circle cx="360" cy="46" r="9" fill="#1F6FEB"/>
    <circle cx="440" cy="46" r="9" fill="#4F7A16"/>
    <rect x="520" y="34" width="24" height="24" rx="4" transform="rotate(45 532 46)" fill="none" stroke="#3FA39E" stroke-width="2.5"/>
    <circle cx="600" cy="46" r="9" fill="#BD561D"/>
  </g>
  <text x="440" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-2" fill="#E6EDF3">Mill</text>
  <text x="440" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9198A1">Guardrailed agentic workflows, on your desktop</text>
</svg>
