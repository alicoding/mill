<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Live view</title>
    <style>
      /* Mill injects its own palette as custom properties on :root and
         updates them in place, so plain CSS follows the user's theme.
         Only the documented frame vocabulary (userdocs plugin-theming
         reference) is used; sizes the palette never promised are
         literal. */
      html, body {
        margin: 0;
        height: 100%;
        font: 13px system-ui, sans-serif;
        color: var(--fgColor-default);
        background: var(--bgColor-default);
      }
      #pane {
        height: 100%;
        box-sizing: border-box;
        padding: 26px 16px 68px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        gap: 12px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex: 0 0 auto;
      }
      .filterInput {
        flex: 1 1 auto;
        padding: 6px 8px;
        border: 1px solid var(--borderColor-default);
        border-radius: 6px;
        background: var(--bgColor-default);
        color: var(--fgColor-default);
        font: inherit;
      }
      button {
        font: inherit;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--borderColor-default);
        background: var(--bgColor-muted);
        color: var(--fgColor-default);
        cursor: pointer;
      }
      button.primary {
        background: var(--mill-accent-emphasis, var(--fgColor-accent));
        color: var(--fgColor-onEmphasis, #fff);
        border-color: transparent;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .emptyState, .errorState {
        padding: 32px;
        text-align: center;
        color: var(--fgColor-muted);
        font-size: 12px;
      }
      .rows {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        border: 1px solid var(--borderColor-default);
        border-radius: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--borderColor-default);
        cursor: pointer;
      }
      .row:last-child { border-bottom: none; }
      .row:hover { background: var(--bgColor-muted); }
      .row.selected { background: var(--bgColor-accent-muted, var(--bgColor-muted)); }
      .rowKey {
        flex: 0 0 auto;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: var(--fgColor-muted);
        min-width: 64px;
      }
      .rowTitle {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip {
        flex: 0 0 auto;
        padding: 2px 8px;
        border-radius: 10px;
        border: 1px solid var(--borderColor-default);
        background: var(--bgColor-muted);
        font-size: 11px;
      }
      .rowAssignee, .rowUpdated {
        flex: 0 0 auto;
        color: var(--fgColor-muted);
        font-size: 11px;
        min-width: 72px;
        text-align: right;
      }
      .detail {
        flex: 0 0 auto;
        border: 1px solid var(--borderColor-default);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .detailHeader {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .transitions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .composer textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 56px;
        padding: 6px 8px;
        border: 1px solid var(--borderColor-default);
        border-radius: 6px;
        background: var(--bgColor-default);
        color: var(--fgColor-default);
        font: inherit;
        resize: vertical;
      }
      .composerActions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .status {
        font-size: 12px;
        color: var(--fgColor-muted);
      }
      .status.error { color: var(--fgColor-danger, #c00); }
    </style>
  </head>
  <body>
    <div id="pane" data-component="mill-live-view-pane"></div>
    <script src="view.js"></script>
  </body>
</html>
