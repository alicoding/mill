<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Roadmap</title>
    <style>
      /* Mill injects its own palette as custom properties on :root and
         updates them in place, so plain CSS follows the user's theme.
         Only the documented frame vocabulary (userdocs plugin-theming
         reference) is used; sizes the palette never promised are
         literal. */
      html, body {
        margin: 0;
        height: 100%;
        font: 13px system-ui, sans-serif;
        color: var(--fgColor-default);
        background: var(--bgColor-default);
      }
      /* The pane's own pad: the same inset the host gave this view as
         Mill's own component (26px top, 68px bottom, flush sides). */
      #pane {
        height: 100%;
        box-sizing: border-box;
        padding: 26px 0 68px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .emptyState {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        color: var(--fgColor-muted);
        font-size: 12px;
      }
      .grid {
        display: grid;
        gap: 1px;
        background: var(--borderColor-default);
        border: 1px solid var(--borderColor-default);
        border-radius: 6px;
        overflow: auto;
        flex: 1 1 auto;
        min-height: 0;
        align-content: start;
      }
      .headerCell, .laneLabel {
        background: var(--bgColor-muted);
        padding: 8px 12px;
        font-weight: 600;
        position: sticky;
        top: 0;
      }
      .headerCell {
        font-size: 12px;
        color: var(--fgColor-muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .laneLabel {
        position: static;
        display: flex;
        align-items: center;
      }
      .cell {
        background: var(--bgColor-default);
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-height: 44px;
      }
      .emptyCell { color: var(--fgColor-muted); font-size: 12px; }
      .cellDragOver {
        background: var(--mill-accent-muted);
        outline: 2px dashed var(--borderColor-accent-emphasis);
        outline-offset: -2px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 4px 8px;
        box-sizing: border-box;
        border: none;
        border-radius: 4px;
        background: var(--bgColor-muted);
        color: var(--fgColor-default);
        font: inherit;
        cursor: pointer;
        overflow: hidden;
      }
      .chip:hover {
        background: color-mix(in srgb, var(--fgColor-muted) 8%, var(--bgColor-muted));
      }
      .chipTitle {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chipDot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .placeCards {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: none;
        background: transparent;
        color: var(--fgColor-muted);
        font: inherit;
        font-size: 12px;
        padding: 2px 6px;
        border-radius: 6px;
        cursor: pointer;
      }
      .placeCards:hover { background: var(--bgColor-default); }
      .picker {
        position: absolute;
        top: 100%;
        right: 0;
        z-index: 20;
        min-width: 180px;
        max-height: 280px;
        overflow: auto;
        background: var(--bgColor-default);
        border: 1px solid var(--borderColor-default);
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        padding: 6px 0;
      }
      .pickerItem {
        display: block;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        color: var(--fgColor-default);
        font: inherit;
        padding: 6px 8px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pickerItem:hover { background: var(--bgColor-muted); }
      .pickerItem[disabled] { color: var(--fgColor-muted); cursor: default; }
      .pickerItem[disabled]:hover { background: transparent; }
      .toastBanner {
        width: fit-content;
        margin: 12px auto 0;
        padding: 4px 12px;
        border: 1px solid var(--borderColor-accent-emphasis);
        border-radius: 12px;
        background: var(--bgColor-default);
        font-size: 13px;
        color: var(--fgColor-default);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
    </style>
  </head>
  <body>
    <div id="pane" data-component="atlas-roadmap-pane"></div>
    <script src="view.js"></script>
  </body>
</html>
