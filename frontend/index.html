<!DOCTYPE html>
<html lang="en" data-light-theme="light" data-dark-theme="dark" data-color-mode="auto">
  <head>
    <!-- Theme before first paint: the persisted choice, else the system's
         (the same key App.tsx writes). Without this the page painted dark
         until React mounted, seconds later behind plugin loading. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('mill-color-mode') || 'auto'
          document.documentElement.setAttribute('data-color-mode', mode)
          document.documentElement.style.colorScheme = mode === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode
        } catch (e) { /* storage unavailable: 'auto' from the markup stands */ }
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mill.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mill</title>
    <!-- Installable-companion metadata (goal 0068) -- only load-bearing
         in server mode over the user's own tailnet; inert in the native
         Wails webview, which never reads a manifest or registers a
         service worker. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mill" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
