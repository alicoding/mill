<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Board contents</title>
    <style>
      /* Mill injects its own palette as custom properties on :root and
         updates them in place, so plain CSS follows the user's theme. */
      body {
        margin: 0;
        padding: 14px 16px;
        font: 13px system-ui, sans-serif;
        color: var(--fgColor-default);
        background: var(--bgColor-default);
      }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
      button {
        font: 12px system-ui, sans-serif;
        padding: 4px 10px;
        border: 1px solid var(--borderColor-default);
        border-radius: 6px;
        background: var(--bgColor-muted);
        color: var(--fgColor-default);
        cursor: pointer;
      }
      h2 { font-size: 12px; font-weight: 600; margin: 12px 0 4px; }
      .row { padding: 2px 0 2px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .empty { color: var(--fgColor-muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>Board contents</h1>
      <button type="button" id="grouping" data-testid="index-grouping"></button>
    </header>
    <div id="list" data-testid="index-list"></div>
    <script src="view.js"></script>
  </body>
</html>
