# Mirrors .github/workflows/ci.yml's checks locally, so a broken commit
# never lands in the first place. Requires frontend/dist to exist for the
# Go jobs (main.go embeds it) -- run `npm run build` in frontend/ once
# after cloning, same prerequisite CI itself has.
pre-commit:
  parallel: true
  jobs:
    - name: file-loc-limit
      glob: "*.{go,ts,tsx}"
      run: ./scripts/check-loc.sh
    - name: workflow-yaml
      glob: ".github/workflows/*.yml"
      run: ./scripts/check-workflow-yaml.sh
    - name: actionlint
      # goal 0419 S1c: semantic checks (expression types, deprecated
      # runtimes, shellcheck on run: scripts) the parse-only check above
      # can't see -- own script's header explains the no-install-here,
      # skip-if-absent posture.
      glob: ".github/workflows/*.yml"
      run: ./scripts/check-actionlint.sh
    - name: comment-hygiene
      glob: "*.{go,ts,tsx}"
      run: ./scripts/check-comment-hygiene.sh
    - name: agent-definitions
      # Goal 0414 S1: every .claude/agents/*.md carries the frontmatter
      # Claude Code's sub-agent contract needs, and the four
      # dispatch-owning agents carry the operational sentinels this
      # goal moved out of every brief. Grep-only, so like
      # comment-hygiene it needs no build setup.
      glob: ".claude/agents/*.md"
      run: ./scripts/check-agent-definitions.sh
    - name: agent-definitions-selftest
      # Fixture-tests the gate above (goal 0414 S2) -- same probe-on-touch
      # shape as review-report-selftest.
      glob: "{.claude/agents/*.md,scripts/check-agent-definitions*.sh}"
      run: ./scripts/check-agent-definitions-selftest.sh
    - name: framework-api-first
      glob: "*.go"
      run: ./scripts/check-framework-api-first.sh
    - name: framework-api-first-selftest
      # Fixture-tests the location half of the gate above (goal 0385) --
      # same probe-on-touch shape as review-report-selftest.
      glob: "scripts/check-framework-api-first*.sh"
      run: ./scripts/check-framework-api-first-selftest.sh
    - name: bash-portability
      # Goal 0403 S2e: a scripts/**/*.sh or build/**/*.sh file using a
      # bash-4-only construct is a latent exit 127/2 on GitHub's macOS
      # runner (/bin/bash 3.2) -- grep-only, so like comment-hygiene it
      # needs no build setup.
      glob: "{scripts/**/*.sh,build/**/*.sh}"
      run: ./scripts/check-bash-portability.sh
    - name: bash-portability-selftest
      # Fixture-tests the gate above -- same probe-on-touch shape as
      # framework-api-first-selftest.
      glob: "scripts/check-bash-portability*.sh"
      run: ./scripts/check-bash-portability-selftest.sh
    - name: test-side-effects
      # Goal 0356: a _test.go file constructing the real clipboard Host
      # adapter without the MILL_CLIPBOARD_HOST_OK opt-in in the same
      # file, or an e2e spec spawning MILL_CLIPBOARD=host without
      # withClipboardLock -- grep-only, so like comment-hygiene it needs
      # no build setup.
      glob: "{*_test.go,frontend/e2e/*.spec.ts}"
      run: ./scripts/check-test-side-effects.sh
    - name: e2e-seed-literals
      glob: "frontend/e2e/**/*.ts"
      # An e2e count of a set the APP owns (registered step types,
      # built-in Extensions rows, the seeded objects filed in one
      # place) must be read back through the surface's own door, never
      # hand-kept: a literal goes stale on the next member and fails
      # the PR that added it. Grep-only, same shape as comment-hygiene.
      run: ./scripts/check-e2e-seed-literals.sh
    - name: e2e-fixed-ports
      glob: "frontend/e2e/**/*.ts"
      # goal 0358 S6: an e2e server binds an OS-assigned port, read back
      # off main.go's MILL_READY line -- never a literal one, the class
      # that let two worktrees' own worker pools collide on one machine.
      run: ./scripts/check-e2e-fixed-ports.sh
    - name: e2e-fixed-ports-selftest
      # Fixture-tests the gate above -- same probe-on-touch shape as
      # framework-api-first-selftest.
      glob: "scripts/check-e2e-fixed-ports*.sh"
      run: ./scripts/check-e2e-fixed-ports-selftest.sh
    - name: e2e-edge-hover
      glob: "frontend/e2e/**/*.ts"
      # A .react-flow__edge locator hovered/clicked directly (not
      # through fixtures/atlasEdge.ts) lands on AtlasLinkEdge's own
      # chip under load, retrying to the test timeout (goal 0358 S8).
      # Grep-only, same shape as e2e-seed-literals.
      run: ./scripts/check-e2e-edge-hover.sh
    - name: ui-copy
      glob: "frontend/src/locales/**/*.json"
      run: ./scripts/check-ui-copy.sh
    - name: drag-regions
      # Goal 0385 widened this to *.go too: the cross-check walks every
      # tracked Go file for a Frameless: true window construction, not
      # just auxwindows.go/main.go by name, so a future window family
      # split (the 500-line convention) still gets caught.
      glob: "{frontend/src/**/*.{css,ts,tsx},*.go}"
      run: ./scripts/check-drag-regions.sh
    - name: drag-regions-selftest
      glob: "scripts/check-drag-regions*.sh"
      run: ./scripts/check-drag-regions-selftest.sh
    - name: gocache-trim-selftest
      glob: "scripts/dev/gocache-trim*.sh"
      run: ./scripts/dev/gocache-trim-selftest.sh
    - name: frame-runtime-fresh
      # Goal 0396: assumes frontend/dist already exists (this file's own
      # header comment's standing prerequisite) -- run `npm run build` in
      # frontend/ first if this fails on a fresh clone.
      glob: "{frontend/src/plugin-frame/**,frontend/vite.config.frame.ts,frontend/public/plugin-frame/**}"
      run: ./scripts/check-frame-runtime-fresh.sh
    - name: frame-runtime-fresh-selftest
      glob: "scripts/check-frame-runtime-fresh*.sh"
      run: ./scripts/check-frame-runtime-fresh-selftest.sh
    - name: vendor-names
      # Goal 0385: semgrep/vendor-names.yml's own header comment carries
      # the value-vs-concept rule and the case-sensitivity split.
      # Requires `brew install semgrep` once (task setup:hooks).
      glob: "{internal/domain/composition/**,internal/services/bridgesvc/**,internal/services/remoteauthsvc/**,frontend/src/views/**,frontend/src/locales/**,userdocs/**,semgrep/**}"
      run: semgrep --config semgrep/ --error --quiet
    - name: vendor-names-selftest
      glob: "{semgrep/**,scripts/check-vendor-names-selftest.sh}"
      run: ./scripts/check-vendor-names-selftest.sh
    - name: webhook-naming
      # Goal 0387: scripts/check-webhook-naming.sh's own header comment
      # carries why this stays a narrower, separate gate from
      # vendor-names above rather than folded into it.
      glob: "{internal/services/bridgesvc/**,internal/services/remoteauthsvc/**,internal/services/triggersvc/triggerwebhook.go,internal/services/triggersvc/webhook_seed_test.go,internal/domain/composition/builtinworkflows_webhook.go,internal/domain/composition/builtinworkflows.go,internal/domain/composition/triggers.go,internal/domain/composition/seedproof_test.go,internal/domain/composition/notifystep_test.go,internal/services/wiring/wiring_webhookrespond.go,internal/domain/audit/audit.go,main.go,frontend/src/shared/webhookTokensStore.ts,frontend/src/shared/webhookCommands.ts,frontend/src/shared/bindings.ts,frontend/src/views/WebhooksSection.tsx,frontend/src/views/SettingsConnectionsPane.tsx,frontend/src/locales/en/views.json,userdocs/how-to/webhooks.md,scripts/check-webhook-naming.sh}"
      run: ./scripts/check-webhook-naming.sh
    - name: no-raf-retry-loop
      # Goal 0366 Class A: semgrep/no-raf-retry-loop.yml's own header
      # comment carries the shape and the ListGridGlide.tsx exclusion's
      # reason (goal 0390 / PR #793).
      glob: "{frontend/src/**/*.{ts,tsx},semgrep/no-raf-retry-loop.yml}"
      run: semgrep --config semgrep/no-raf-retry-loop.yml --error --quiet .
    - name: no-raf-retry-loop-selftest
      glob: "{semgrep/no-raf-retry-loop.yml,semgrep/fixtures/no-raf-retry-loop/**,scripts/check-no-raf-retry-loop-selftest.sh}"
      run: ./scripts/check-no-raf-retry-loop-selftest.sh
    - name: fuzzy-search-surfaces
      # Goal 0366 Class B: flags a new picker/search-shaped file
      # (*Palette*/*Picker*/*Browse* under frontend/src) filtering with
      # a plain substring test instead of shared/fuzzyFilter.ts.
      glob: "{frontend/src/**/*.{ts,tsx},semgrep/fuzzy-search-surfaces.yml}"
      run: semgrep --config semgrep/fuzzy-search-surfaces.yml --error --quiet .
    - name: fuzzy-search-surfaces-selftest
      glob: "{semgrep/fuzzy-search-surfaces.yml,semgrep/fixtures/fuzzy-search-surfaces/**,scripts/check-fuzzy-search-surfaces-selftest.sh}"
      run: ./scripts/check-fuzzy-search-surfaces-selftest.sh
    - name: toolbar-action-testids
      glob: "{frontend/src/atlas/AtlasToolbar.tsx,frontend/e2e/*.spec.ts,frontend/e2e/fixtures/toolbarActions.ts}"
      run: ./scripts/check-toolbar-action-testids.sh
    - name: docsgen-freshness
      # A hand-edited userdocs page without a docsgen regeneration
      # fails only in CI (TestUserDocs_MatchCommitted) -- run the same
      # freshness test here so the fix is one local `go generate
      # ./internal/docsgen` away, not a failed PR round trip. A commit
      # touching userdocs/reference/plugin-api/** triggers this AND
      # sdk-freshness below together; sdk-freshness's typedoc run does
      # a full wipe-then-regenerate of that tree (verified: even an
      # unrelated page's mtime moves on every run), so the two gates
      # race on the same files when lefthook's `parallel: true` runs
      # them at once -- this test reads that tree mid-wipe and sees a
      # different family's evidence between two calls a few ms apart
      # (goal 0357 S2 hit it repeatably). A dedicated lock (never the
      # default with-gate-lock.sh path go-test/vitest use, so this
      # never waits behind an unrelated heavy suite) serializes the
      # two against each other instead.
      glob: "{userdocs/**,internal/docsgen/**,README.md}"
      run: MILL_GATE_LOCK_DIR="${TMPDIR:-/tmp}/mill-docs-freshness-gate.lock" ./scripts/with-gate-lock.sh go test ./internal/docsgen/
    - name: sdk-freshness
      # The plugin SDK's committed type package and its generated API
      # reference both derive from frontend/src/plugins/sdk.ts and its
      # sdk/ contribution-kind files -- same commit-and-verify shape as
      # docsgen-freshness just above, one script CI's own sdk-freshness
      # job also calls. Same dedicated lock as docsgen-freshness above
      # -- see that job's comment for the race it closes.
      glob: "{frontend/src/plugins/sdk.ts,frontend/src/plugins/sdk/**,frontend/plugin-sdk/**,frontend/typedoc.json,userdocs/reference/plugin-api/**}"
      run: MILL_GATE_LOCK_DIR="${TMPDIR:-/tmp}/mill-docs-freshness-gate.lock" ./scripts/with-gate-lock.sh ./scripts/check-sdk-freshness.sh
    - name: sdk-comments
      # The generated SDK types/reference must read as author-facing
      # documentation, never repository internals -- one script CI's
      # own sdk-comments job also calls.
      glob: "{frontend/src/plugins/sdk.ts,frontend/src/plugins/sdk/**,frontend/plugin-sdk/**,userdocs/reference/plugin-api/**}"
      run: ./scripts/check-sdk-comments.sh
    - name: affected-selftest
      # Goal 0401 hotfix: proves scripts/list-affected-go-packages.sh's
      # per-event base resolution (pull_request/merge_group/push) and its
      # bash-3.2 compatibility (CI's macos-latest runner's system
      # /bin/bash predates mapfile/readarray) against real commits on
      # this branch, so a future edit can't silently reintroduce either.
      glob: "{scripts/list-affected-go-packages.sh,scripts/check-affected-selftest.sh,.github/workflows/ci.yml}"
      run: ./scripts/check-affected-selftest.sh
    - name: plugin-typecheck
      root: "frontend/"
      glob: "{frontend/plugin-sdk/**,examples/plugins/**/*.js}"
      run: npm run plugin:typecheck
    - name: plugin-lint
      root: "frontend/"
      glob: "examples/plugins/**/*.js"
      run: npm run plugin:lint
    - name: doc-paths
      # docs/ is a private nested checkout (absent on public clones):
      # skip silently when missing; mill-docs' own CI is the enforcing
      # caller there. No glob -- the cited paths live outside docs/,
      # so any commit can invalidate them.
      run: 'test ! -f docs/scripts/check-doc-paths.sh || { bash docs/scripts/check-doc-paths.sh && bash docs/scripts/gen-adr-readme.sh --check; }'
    - name: rules-frontmatter
      # Lefthook's `**` requires 1+ directories deep (non-standard --
      # confirmed against its own docs, not gitignore-style zero-or-more),
      # so `.claude/rules/**/*.md` never matches a file directly in
      # rules/, only in a subdirectory of it. Every rule file today is
      # flat (frontend.md, backend.md, ...), so this glob is what
      # actually matches them; revisit if/when a nested rules/<topic>/
      # directory is ever added (docs/SPEC.md §9.1 -- Claude Code
      # supports it, Mill doesn't use it yet).
      glob: ".claude/rules/*.md"
      run: ./scripts/check-rules-frontmatter.sh
    - name: standing-context
      # No glob, deliberately: CLAUDE.md and every unconditional rule
      # file load into EVERY session regardless of which files a commit
      # touches, so a budget breach from prose alone (no code change)
      # must still be caught. check-standing-context.sh is fast (wc -l/
      # wc -w only), so unconditional is cheap, same shape as
      # root-file-naming just below.
      run: ./scripts/check-standing-context.sh
    - name: codex-context
      run: ./scripts/check-codex-context.sh
    - name: hook-command-guard
      glob: "scripts/hook-command-guard.sh"
      run: ./scripts/check-hook-command-guard.sh
    - name: hook-subagent-stop-selftest
      # Fixture-tests the SubagentStop hook (goal 0414 S3): a builder
      # never ends a turn with a dirty goal-branch worktree -- same
      # probe-on-touch shape as hook-command-guard's own job just above.
      glob: "{scripts/hook-subagent-stop.sh,scripts/hook-subagent-stop-selftest.sh}"
      run: ./scripts/hook-subagent-stop-selftest.sh
    - name: selftest-git-isolation
      # Goal 0394: any scripts/*.sh creating a throwaway git repo must
      # source scripts/lib/git-fixture.sh, which clears the calling
      # process's git environment before touching the fixture -- a
      # git-commit-invoked hook otherwise redirects that call at the
      # REAL repo (this goal's Why: a flipped core.bare, ~7000 staged
      # deletions on the real index, twice). No glob restriction to a
      # single script -- ANY scripts/*.sh addition/edit can introduce
      # an unisolated git call, so this runs on every commit like
      # hook-command-guard/standing-context just above; it is fast
      # (git ls-files + grep only).
      run: ./scripts/check-selftest-git-isolation.sh
    - name: selftest-git-isolation-selftest
      glob: "scripts/check-selftest-git-isolation*.sh"
      run: ./scripts/check-selftest-git-isolation-selftest.sh
    - name: install-lock-selftest
      # Goal 0403 S2c: two concurrent installed-app passes clobber the
      # same /Applications/Mill.app bundle mid-install and each other's
      # launched process -- scripts/with-install-lock.sh serializes
      # them; this probes serialization, stale-holder reclaim, the
      # bounded-wait exit code and --acquire/--release reentrancy.
      glob: "{scripts/with-install-lock.sh,scripts/check-install-lock-selftest.sh,Taskfile.yml}"
      run: ./scripts/check-install-lock-selftest.sh
    - name: installed-process-selftest
      # Install replacement is allowed only after every process executing the
      # installed binary exits; a same-basename process at another path stays.
      glob: "{scripts/stop-installed-app.sh,scripts/check-installed-process-selftest.sh,Taskfile.yml}"
      run: ./scripts/check-installed-process-selftest.sh
    - name: review-report-selftest
      # Fixture-tests the pre-PR review gate itself (goal 0383) --
      # mirrors hook-command-guard's own probe-on-touch shape; the live
      # gh-backed check (check-review-report.sh against a real PR) only
      # makes sense in CI, where an actual PR exists.
      glob: "scripts/check-review-report*.sh"
      run: ./scripts/check-review-report-selftest.sh
    - name: go-mod-tidy
      # Catches a go.mod/go.sum left stale after a dependency change
      # (a direct/indirect misclassification, an unpruned require) --
      # mirrors CI's own go-mod-tidy job. `-diff` (Go 1.23+) reports
      # without rewriting the tree.
      glob: "go.mod"
      run: go mod tidy -diff
    - name: root-file-naming
      # No glob, deliberately: .ls-lint.yml now covers every file type
      # at the repo root (its `.*` catch-all), not just .go, so this
      # must run on every commit -- a stray .png/.txt staged at root
      # would never match a "*.go" glob. ls_lint is near-instant, so
      # unconditional is cheap. Mirrors CI's own root-file-naming job
      # (also unconditional). Requires `go install
      # github.com/loeffel-io/ls-lint/v2/cmd/ls_lint@v2.3.1` once locally
      # (same one-time-setup shape as golangci-lint itself). Runs through
      # scripts/check-root-naming.sh so a failure ends in an unmistakable
      # COMMIT BLOCKED banner -- this job runs without a glob, and
      # lefthook's summary line on its own gave a failed run no FAIL
      # wording (goal 0358 S10).
      fail_text: COMMIT BLOCKED -- see the banner above; only allowlisted names live at the repo root (.ls-lint.yml)
      run: ./scripts/check-root-naming.sh
    - name: go-vet
      glob: "*.go"
      # scripts/lib/build-env.sh: the default (non-server) tag set
      # compiles Mill's own darwin cgo files, which need the one
      # macOS-deployment-target env every other Go build/test gate
      # below also sources -- golangci-lint/gocognit-new/depguard-new
      # and go-build-server all pass --build-tags=server instead,
      # which excludes those `!server`-tagged files, so they don't.
      run: . scripts/lib/build-env.sh && go vet . ./internal/...
    - name: golangci-lint
      glob: "*.go"
      # --build-tags=server matches ci.yml's own golangci-lint-action
      # args exactly -- without it this job lints the DEFAULT (desktop)
      # tag set, a strictly larger file set than CI's job ever compiles
      # (`!server`-tagged files CI's own -tags=server run never sees),
      # so a local pass here was checking something CI doesn't and a
      # local fail could block a commit CI's real gate would accept.
      # --allow-parallel-runners: this job and gocognit-new run
      # concurrently under lefthook's parallel executor and share
      # golangci-lint's lock file -- without the flag whichever starts
      # second dies with "parallel golangci-lint is running" (hit
      # repeatedly; previously worked around by re-running the commit).
      # GOLANGCI_LINT_CACHE per-checkout (all three golangci jobs): the
      # user-level cache (~/Library/Caches/golangci-lint) is shared
      # across every worktree on the machine and retains absolute paths
      # from deleted checkouts, producing spurious findings in files a
      # commit never touched (twice-hit class). A cache under this
      # checkout's own gitignored .task/ isolates each worktree; the
      # cost is one cold lint per fresh worktree.
      run: GOLANGCI_LINT_CACHE="$PWD/.task/golangci-cache" golangci-lint run . ./internal/... --build-tags=server --allow-parallel-runners
    - name: gomodguard-selftest
      # Fixture-tests the gomodguard_v2 wiring above (goal 0385) against
      # a throwaway module -- same probe-on-touch shape as
      # review-report-selftest.
      glob: "{.golangci.yml,scripts/check-gomodguard-selftest.sh}"
      run: ./scripts/check-gomodguard-selftest.sh
    - name: gocognit-new
      glob: "*.go"
      # Cognitive complexity gates NEW/CHANGED code only (goal 0109,
      # Sonar's clean-as-you-code posture): 25 legacy functions sit
      # over the threshold (burn-down in the goal file), so the gate
      # scopes to the merge-base diff instead of failing every build
      # or inflating the threshold into meaninglessness. Threshold
      # lives in .golangci.yml's gocognit settings; --tests=false is
      # the goal file's own recorded verdict (seeded-example tests
      # dominate the noise; production code is the gate's subject).
      run: GOLANGCI_LINT_CACHE="$PWD/.task/golangci-cache" golangci-lint run . ./internal/... --build-tags=server --enable-only gocognit --new-from-merge-base=origin/main --tests=false --allow-parallel-runners
    - name: depguard-new
      glob: "*.go"
      # Boundary-enforcement gate on NEW/CHANGED code only (goal 0168):
      # 22 legacy direct imports of wails/v3/pkg/application sit outside
      # internal/adapters/windowing, burning down as they migrate, so
      # this scopes to the merge-base diff instead of failing every
      # build. Threshold/rule lives in .golangci.yml's depguard
      # settings; same --tests=false / --allow-parallel-runners
      # reasoning as gocognit-new just above.
      run: GOLANGCI_LINT_CACHE="$PWD/.task/golangci-cache" golangci-lint run . ./internal/... --build-tags=server --enable-only depguard --new-from-merge-base=origin/main --tests=false --allow-parallel-runners
    - name: script-tests
      # goal 0413 S2 rider: the first entry in this group -- a shell
      # script that needs proving beyond exit-code review gets a sibling
      # scripts/<name>.test.sh, globbed alongside the script itself so
      # editing either re-runs it.
      glob: "scripts/{check-go-coverage.sh,*.test.sh}"
      run: for t in scripts/*.test.sh; do bash "$t"; done
    - name: go-test
      glob: "*.go"
      # Root package (`.`) included alongside ./internal/... -- the
      # service test files (now under internal/services/*) run via the
      # ./internal/... half; the root package itself (main.go only) has
      # no tests but stays listed so a future root test can't silently
      # run nowhere. No new frontend/dist dependency: go-vet and
      # go-build-desktop below already build the root package locally,
      # so that requirement (this file's own header comment) already
      # applied before this line did.
      run: ./scripts/with-gate-lock.sh bash -c 'source scripts/lib/build-env.sh && OUT="$(mktemp "${TMPDIR:-/tmp}/mill-cover.XXXXXX")" && go test . ./internal/... -race -coverprofile="$OUT" && bash scripts/check-go-coverage.sh "$OUT"'
    - name: go-build-desktop
      glob: "*.go"
      # scripts/lib/build-env.sh: see go-vet's own comment -- this is
      # the exact `go build .` invocation item 2's acceptance line
      # names.
      run: . scripts/lib/build-env.sh && go build -o /dev/null .
    - name: go-build-server
      glob: "*.go"
      run: go build -tags server -o /dev/null .
    - name: build-warnings
      # goal 0419 S1/S1c: go-build-desktop/go-vet above only check exit
      # status -- a linker/clang warning on stderr passes silently.
      # This gate fails the commit on any of it instead, including the
      # test-binary compile step (the launchatlogin-shaped class a
      # bare `go build .` never links).
      glob: "*.go"
      run: ./scripts/check-build-warnings.sh
    - name: build-warnings-selftest
      # Fixture-tests the gate above via a stubbed `go` -- same
      # probe-on-touch shape as review-report-selftest.
      glob: "scripts/check-build-warnings*.sh"
      run: ./scripts/check-build-warnings-selftest.sh
    - name: eslint
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx}"
      run: npm run lint
    - name: notice-action-eslint-selftest
      # Fixture-tests the NoticeAction inline-onClick ban above (goal
      # 0385) against a real, transient file (ESLint's type-aware parser
      # refuses a virtual path) -- same probe-on-touch shape as
      # review-report-selftest.
      glob: "{frontend/eslint.config.js,scripts/check-notice-action-eslint-selftest.sh}"
      run: ./scripts/check-notice-action-eslint-selftest.sh
    - name: boundaries
      # docs/adr/0012: dependency-cruiser enforces the bounded-context
      # folder rules (src/app|views|composition|configure|shared) --
      # mirrors CI's own frontend job, same "one check, two runners"
      # discipline as file-loc-limit/rules-frontmatter.
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx}"
      run: npm run boundaries
    - name: vitest
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx}"
      run: ../scripts/with-gate-lock.sh npm run test
    - name: tsc
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx}"
      run: npx tsc --noEmit
