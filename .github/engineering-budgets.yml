# Weekly engineering-health budgets (goal 0413 S1 Decision 1, plus the
# toolchain-currency thresholds goal 0419 S3 folds in here rather than a
# separate job). Read by internal/tools/enghealth via gopkg.in/yaml.v3 --
# never `yq` in workflow bash. A breach marks status "warning" in the
# table and never fails this run; instead it opens or refreshes its own
# tracking issue, labelled with the class below (goal 0413 S2).
lead_time_p50_hours_max: 24
merge_group_p50_minutes_max: 45
queue_wait_p50_minutes_max: 10
merge_group_failure_rate_pct_max: 10
retry_passed_rate_pct_max: 1
dependabot_pr_age_days_max: 7
open_goal_prs_max: 6
files_near_loc_cap_max: 10
# Mirrors scripts/check-go-coverage.sh's FLOOR and
# frontend/vite.config.ts's coverage.thresholds.lines at authoring time;
# raise both together with the real gate when real coverage climbs.
go_coverage_floor_pct: 75
vitest_coverage_floor_pct: 12
go_minors_behind_max: 1
node_minors_behind_max: 1
wails_betas_behind_max: 1
playwright_minors_behind_max: 1

# The defect/machinery class each budget's breach becomes a tracking
# issue for (goal 0413 S2 contract item 1) -- keyed by the budget's own
# YAML key above, read via Budgets.ClassFor. Every key above needs a row
# here (TestClassFor_EveryBudgetHasAClass in internal/tools/enghealth
# fails the build otherwise).
classes:
  lead_time_p50_hours_max: merge-capacity
  merge_group_p50_minutes_max: merge-capacity
  queue_wait_p50_minutes_max: merge-capacity
  merge_group_failure_rate_pct_max: ci-flake-or-drift
  retry_passed_rate_pct_max: flake
  dependabot_pr_age_days_max: deps-dont-linger
  open_goal_prs_max: wip-limit
  files_near_loc_cap_max: missed-seam
  go_coverage_floor_pct: coverage-ratchet
  vitest_coverage_floor_pct: coverage-ratchet
  go_minors_behind_max: deps-dont-linger
  node_minors_behind_max: deps-dont-linger
  wails_betas_behind_max: deps-dont-linger
  playwright_minors_behind_max: deps-dont-linger
